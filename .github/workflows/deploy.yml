name: Deploy Clark Bot

# Deploys by rebuilding the rootless podman image and restarting the quadlet service.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            cd ~/Clark-open-sourced
            git fetch origin
            git reset --hard origin/main
            podman build -t localhost/clark:latest .
            systemctl --user restart clark.service
            podman image prune -f
